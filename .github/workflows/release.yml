name: Release

# Builds a multi-arch (linux/amd64 + linux/arm64) image and publishes it to
# public GHCR when a v* tag is pushed. Tags the specific version plus :latest.
# Consumers reference a specific v* tag (AWS: the SUBSCRIBER_FANOUT_IMAGE
# variable; self-host: the compose image tag) and bump via PR.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  release:
    name: Build + push image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Docker refs must be lowercase; github.repository_owner may not be.
      - name: Derive lowercase image name
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "IMAGE=ghcr.io/${OWNER,,}/subscriber-fanout" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Build + push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Output image tags
        run: |
          echo "Published:"
          echo '${{ steps.meta.outputs.tags }}'
