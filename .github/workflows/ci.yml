name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (MongoDB ${{ matrix.mongodb }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mongodb: ['7.0.14', '8.0.38']
    env:
      # mongodb-memory-server downloads this mongod on first use; keep it in
      # step with the cache key below.
      MONGOMS_VERSION: ${{ matrix.mongodb }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.1
          run_install: false

      # All dependencies are public - no registry auth needed (fork-PR safe).
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ env.MONGOMS_VERSION }}

      - name: Test
        run: pnpm test

  # Keeps the check name the branch ruleset requires, and fails when any test leg fails.
  typecheck:
    name: Typecheck + build
    runs-on: ubuntu-latest
    needs: test
    if: always()
    steps:
      - name: Test legs passed
        run: test "${{ needs.test.result }}" = success

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.1
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  docker-smoke:
    name: Docker build (smoke)
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
